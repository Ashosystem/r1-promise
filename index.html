<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
  <title>Promise</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 240px; height: 282px; overflow: hidden; background: #000; }
    #appFrame {
      position: absolute; top: 0; left: 0;
      width: 240px; height: 282px; border: none; display: block;
      transition: transform 0.15s ease;
    }
    /* Landscape: rotate the whole app -90deg; effective area becomes 282×240 */
    #appFrame.landscape {
      width: 282px; height: 240px; top: 21px; left: -21px;
      transform: rotate(-90deg); transform-origin: center;
    }

    /* Push-to-talk listening indicator (only shows while the side button is held) */
    #pttIndicator {
      position: fixed; top: 0; left: 0; right: 0;
      display: none; align-items: center; justify-content: center; gap: 6px;
      height: 22px; background: rgba(220,38,38,0.92); color: #fff;
      font: 600 11px/1 system-ui, sans-serif; letter-spacing: .3px;
      z-index: 99999; pointer-events: none;
    }
    #pttIndicator.on { display: flex; }
    #pttIndicator .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #fff;
      animation: pttPulse 0.9s infinite;
    }
    @keyframes pttPulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  </style>
</head>
<body>
  <iframe
    id="appFrame"
    src="https://ashosystem.github.io/promise-web-app/?r1=1&v=6"
    scrolling="yes"
    allowfullscreen
  ></iframe>

  <div id="pttIndicator"><span class="dot"></span>Listening…</div>

  <script>
    const frame = document.getElementById('appFrame');
    const indicator = document.getElementById('pttIndicator');
    let recording = false;

    function showIndicator() { indicator.classList.add('on'); }
    function hideIndicator() { indicator.classList.remove('on'); }

    function startRecording() {
      if (recording) return;
      recording = true;
      showIndicator();
      // Screen taps can't trigger native PTT, so we explicitly drive recording.
      try { if (window.CreationVoiceHandler) CreationVoiceHandler.postMessage('start'); } catch (e) {}
    }
    function stopRecording() {
      if (!recording) return;
      recording = false;
      hideIndicator();
      try { if (window.CreationVoiceHandler) CreationVoiceHandler.postMessage('stop'); } catch (e) {}
    }

    // Hardware push-to-talk: side button held → record, released → stop.
    window.addEventListener('longPressStart', startRecording);
    window.addEventListener('longPressEnd', stopRecording);

    // Pull a transcript out of whatever shape the plugin message arrives in.
    function extractTranscript(p) {
      if (!p) return null;
      if (p.transcript && (p.type === 'sttEnded' || !p.type)) return p.transcript;
      if (p.transcript) return p.transcript;
      let d = p.data;
      if (typeof d === 'string') { try { d = JSON.parse(d); } catch (e) {} }
      if (d && typeof d === 'object') {
        if (d.transcript) return d.transcript;
        let dd = d.data;
        if (typeof dd === 'string') { try { dd = JSON.parse(dd); } catch (e) {} }
        if (dd && typeof dd === 'object' && dd.transcript) return dd.transcript;
      }
      return null;
    }

    function deliverTranscript(text) {
      if (!text) return;
      recording = false;
      hideIndicator();
      // Forward into the app iframe; app.js inserts it into the focused field.
      frame.contentWindow.postMessage({ type: 'r1-voice-transcript', text: text }, '*');
    }

    // STT results come back through the R1 plugin-message channel, NOT window 'message'.
    // This is a plain-HTML creation with no r1-create SDK loaded, so owning
    // window.onPluginMessage directly is safe (no SDK chain to break).
    window.onPluginMessage = function (payload) {
      const t = extractTranscript(payload);
      if (t) deliverTranscript(t);
    };

    // Desktop testing fallback: hold Space to simulate the side button.
    window.addEventListener('keydown', (e) => { if (e.code === 'Space' && !e.repeat) { e.preventDefault(); startRecording(); } });
    window.addEventListener('keyup',   (e) => { if (e.code === 'Space') { e.preventDefault(); stopRecording(); } });

    /* ---- Screen rotation via accelerometer ---- */
    // devicemotion is only available on the top Creation window, not the
    // cross-origin iframe, so the wrapper detects orientation and both rotates
    // the iframe element and tells the app to reflow to the new width.
    let isLandscape = false;
    function applyOrientation(landscape) {
      if (landscape === isLandscape) return;
      isLandscape = landscape;
      frame.classList.toggle('landscape', landscape);
      try { frame.contentWindow.postMessage({ type: 'r1-orientation', landscape: landscape }, '*'); } catch (e) {}
    }
    window.addEventListener('devicemotion', (ev) => {
      const a = ev.accelerationIncludingGravity || ev.acceleration;
      if (!a || a.x == null) return;
      const ax = Math.abs(a.x);
      if (ax > 7) applyOrientation(true);        // held sideways
      else if (ax < 4) applyOrientation(false);  // upright (hysteresis band 4–7)
    });
    // Desktop testing fallback: 'r' toggles landscape.
    window.addEventListener('keydown', (e) => { if (e.key === 'r') applyOrientation(!isLandscape); });
  </script>
</body>
</html>
